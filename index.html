<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>我的个人作品集 | Portfolio</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: "Segoe UI",Microsoft YaHei,sans-serif;
      background-color: #f5f7fa;
      color: #333;
      line-height: 1.7;
    }
    .header {
      background: #2c3e50;
      color: #fff;
      text-align: center;
      padding: 60px 20px;
    }
    .header h1 {
      font-size: 36px;
      margin-bottom: 10px;
    }
    .header p {
      font-size: 18px;
      opacity: 0.8;
    }
    .container {
      max-width: 1000px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .title-line {
      font-size: 24px;
      margin: 50px 0 20px;
      border-left: 5px solid #3498db;
      padding-left: 15px;
    }
    .project-card {
      background: #fff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      margin-bottom: 25px;
    }
    .project-card h3 {
      color: #2c3e50;
      margin-bottom: 10px;
      font-size: 20px;
    }
    .project-card p {
      color: #666;
      margin-bottom: 12px;
    }
    .project-card a {
      display: inline-block;
      background: #3498db;
      color: #fff;
      padding: 8px 16px;
      border-radius: 6px;
      text-decoration: none;
      margin-right: 10px;
    }
    .project-card a:hover {
      background: #2980b9;
    }
    .footer {
      text-align: center;
      padding: 40px;
      color: #888;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>你的姓名</h1>

  </div>

  <div class="container">

      <p>技能：HTML/CSS/JS、网页开发、脚本工具、项目搭建等</p>
    </div>

    <h2 class="title-line">项目作品</h2>

      <h3>项目一：个人静态主页</h3>

      <a href="https://github.com/你的用户名/仓库名">查看源码</a>
    </div>

    <div class="project-card">

  <div class="footer">
    © 2025 个人作品集 | GitHub Pages 托管

</html>
